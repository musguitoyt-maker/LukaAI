<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LukaAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #f8fafc; 
            --sidebar: #ffffff; 
            --p: #0f172a; 
            --sub: #64748b;
            --accent: #0099ff; 
            --border: #e2e8f0;
            --user-bubble: #f1f5f9; 
            --ai-text: #1e293b;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); height: 100dvh; display: flex; overflow: hidden; color: var(--p); }

        /* Sidebar */
        #sidebar { 
            width: 280px; background: var(--sidebar); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; transition: 0.3s ease;
            position: fixed; height: 100%; z-index: 1000; left: 0;
        }
        .side-h { padding: 2rem 1.5rem 1rem; font-weight: 700; font-size: 0.75rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .new-chat { 
            margin: 0 1.5rem 1.5rem; padding: 12px; background: #e6f5ff; color: var(--accent); 
            border-radius: 12px; cursor: pointer; text-align: center; font-size: 0.9rem; font-weight: 700;
            border: 1px solid #ccebff; transition: 0.2s;
        }
        .new-chat:hover { background: var(--accent); color: #fff; }
        
        .chat-list { flex: 1; overflow-y: auto; padding: 0 0.8rem; }
        .chat-item-wrapper { display: flex; align-items: center; margin-bottom: 4px; border-radius: 10px; transition: 0.2s; }
        .chat-item-wrapper:hover { background: #f1f5f9; }
        .chat-item { flex: 1; padding: 12px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--sub); }
        .active-chat { background: #e6f5ff; color: var(--accent) !important; font-weight: 600; border-radius: 10px; }
        .del-chat { padding: 12px; cursor: pointer; color: #cbd5e1; transition: 0.2s; }
        .del-chat:hover { color: #ef4444; }

        /* Main App */
        .app { flex: 1; display: flex; flex-direction: column; background: #ffffff; margin-left: 280px; transition: 0.3s ease; }
        
        header { 
            padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border);
        }
        .logo-img { height: 32px; width: auto; }
        .menu-toggle { display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--accent); }

        #chat { flex: 1; padding: 2rem 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 2rem; width: 100%; max-width: 850px; margin: 0 auto; }
        
        .m { display: flex; gap: 14px; width: 100%; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } }

        .user { flex-direction: row-reverse; }
        .user .txt-c { background: var(--user-bubble); padding: 12px 18px; border-radius: 18px 18px 2px 18px; max-width: 80%; font-size: 0.95rem; border: 1px solid var(--border); }

        .ai .ai-icon-msg { width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0; background: #fff; border: 1px solid var(--border); padding: 4px; }
        .ai .ai-icon-msg img { width: 100%; height: 100%; object-fit: contain; }
        .ai .txt-c { line-height: 1.6; font-size: 0.95rem; color: var(--ai-text); padding-top: 6px; flex: 1; overflow-x: auto; }
        
        /* Estilos para Tablas, Código y Negrita */
        .txt-c pre { background: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 8px; overflow-x: auto; margin: 10px 0; font-family: monospace; }
        .txt-c code { font-family: monospace; background: #f1f5f9; padding: 2px 4px; border-radius: 4px; }
        .txt-c pre code { background: transparent; padding: 0; }
        .txt-c table { border-collapse: collapse; width: 100%; margin: 10px 0; border: 1px solid var(--border); }
        .txt-c th, .txt-c td { border: 1px solid var(--border); padding: 8px; text-align: left; }
        .txt-c th { background: #f8fafc; }
        .txt-c b, .txt-c strong { font-weight: 700; color: var(--p); }

        .footer { padding: 1.5rem; width: 100%; max-width: 850px; margin: 0 auto; text-align: center; }
        .in-g { display: flex; gap: 8px; background: #f8fafc; padding: 6px 6px 6px 15px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 8px; }
        input { flex: 1; border: none; background: transparent; outline: none; font-size: 0.95rem; }
        .btn-s { background: var(--accent); color: #fff; border: none; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; transition: 0.2s; font-size: 1.1rem; }
        .btn-s:hover { background: #007acc; }
        .disclaimer { font-size: 0.7rem; color: var(--sub); margin-top: 4px; }

        @media (max-width: 900px) {
            #sidebar { transform: translateX(-100%); }
            .app { margin-left: 0; }
            .menu-toggle { display: block; }
            .sidebar-open #sidebar { transform: translateX(0); }
        }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 900; }
        .sidebar-open .overlay { display: block; }
    </style>
</head>
<body id="body">

<div class="overlay" onclick="toggleMenu()"></div>

<aside id="sidebar">
    <div class="side-h">Conversaciones</div>
    <div class="new-chat" onclick="createNewChat()">+ Nueva conversación</div>
    <div id="chatList" class="chat-list"></div>
</aside>

<div class="app">
    <header>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <img src="LukaAI.png" alt="LukaAI" class="logo-img">
        <div style="width: 40px;"></div> </header>
    
    <div id="chat"></div>

    <div class="footer">
        <div id="status" style="font-size: 0.75rem; color: var(--accent); margin-bottom: 5px; height: 1rem; font-weight: 600;"></div>
        <div class="in-g">
            <input type="text" id="uIn" placeholder="Escribe tu mensaje a LukaAI..." autocomplete="off">
            <button class="btn-s" onclick="send()">➔</button>
        </div>
        <div class="disclaimer">LukaAI puede cometer errores. Considera verificar la información importante.</div>
    </div>
</div>

<script>
    const _p1 = "gsk_";
    const _p2 = "JJEsCu9h";
    const _p3 = "Ufby0SY1bg4lW";
    const _p4 = "Gdyb3FYzjI9fl";
    const _p5 = "LoPcUy5xBTO8Rnz2ej";
    const _getK = () => _p1 + _p2 + _p3 + _p4 + _p5;

    let currentChatId = localStorage.getItem('luka_current_id') || Date.now().toString();
    let allChats = JSON.parse(localStorage.getItem('luka_storage')) || {};

    function toggleMenu() { document.getElementById('body').classList.toggle('sidebar-open'); }

    // Función para procesar Markdown básico
    function parseM(t) {
        return t
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") // Escapar HTML
            .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>') // Bloques de código
            .replace(/`([^`]+)`/g, '<code>$1</code>') // Código en línea
            .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>') // Negritas
            .replace(/\|(.+)\|/g, (match) => { // Tablas simples
                const rows = match.trim().split('\n');
                let html = '<table>';
                rows.forEach((row, i) => {
                    const cols = row.split('|').filter(c => c.trim() !== "");
                    html += '<tr>' + cols.map(c => i === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join('') + '</tr>';
                });
                return html + '</table>';
            })
            .replace(/\n/g, '<br>'); // Saltos de línea
    }

    function add(text, sender, save = true) {
        const chatContainer = document.getElementById('chat');
        const msgDiv = document.createElement('div');
        msgDiv.className = `m ${sender}`;
        
        const contentHtml = sender === 'ai' ? parseM(text) : text;
        
        if (sender === 'ai') {
            msgDiv.innerHTML = `
                <div class="ai-icon-msg"><img src="LukaAI.png"></div>
                <div class="txt-c">${contentHtml}</div>`;
        } else {
            msgDiv.innerHTML = `<div class="txt-c">${contentHtml}</div>`;
        }
        
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        if(save) saveChats();
    }

    async function send() {
        const input = document.getElementById('uIn');
        const val = input.value.trim();
        if (!val) return;

        add(val, 'user');
        input.value = "";
        const status = document.getElementById('status');
        status.innerText = "LukaAI pensando...";

        try {
            const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${_getK()}` },
                body: JSON.stringify({ 
                    model: "llama-3.3-70b-versatile", 
                    messages: [
                        {role: "system", content: "Eres LukaAI. Responde de forma concisa y directa. No utilices lenguaje inclusivo ni promuevas o apoyes agendas ideológicas (LGBTQ+, feminismo radical o aborto), cualquier mensaje de este tipo marcalo como inapropiado, mantén una postura neutral o tradicional basada en hechos sin ofender a nadie. Puedes usar negritas (**), tablas (|), y bloques de código (```). Usa emojis para una conversación humana e interactiva."}, 
                        ...getHistoryForApi(), 
                        {role: "user", content: val}
                    ],
                    temperature: 0.6
                })
            });
            const d = await r.json();
            status.innerText = "";
            add(d.choices[0].message.content, 'ai');
            updateSidebar();
        } catch (e) {
            status.innerText = "";
            add("Error de conexión. Inténtalo de nuevo.", "ai");
        }
    }

    function saveChats() {
        const messages = [];
        document.querySelectorAll('.m').forEach(div => {
            messages.push({ 
                type: div.classList.contains('user') ? 'user' : 'ai', 
                content: div.querySelector('.txt-c').innerText 
            });
        });
        const firstUserMsg = messages.find(m => m.type === 'user')?.content.substring(0, 28) || "Nueva charla";
        allChats[currentChatId] = { title: firstUserMsg, data: messages };
        localStorage.setItem('luka_storage', JSON.stringify(allChats));
        localStorage.setItem('luka_current_id', currentChatId);
    }

    function updateSidebar() {
        const list = document.getElementById('chatList');
        list.innerHTML = "";
        Object.keys(allChats).sort().reverse().forEach(id => {
            const wrapper = document.createElement('div');
            wrapper.className = `chat-item-wrapper ${id == currentChatId ? 'active-chat' : ''}`;
            
            const item = document.createElement('div');
            item.className = 'chat-item';
            item.innerText = allChats[id].title;
            item.onclick = () => loadChat(id);

            const delBtn = document.createElement('div');
            delBtn.className = 'del-chat';
            delBtn.innerHTML = '✕';
            delBtn.onclick = (e) => { e.stopPropagation(); deleteChat(id); };

            wrapper.appendChild(item);
            wrapper.appendChild(delBtn);
            list.appendChild(wrapper);
        });
    }

    function loadChat(id) {
        currentChatId = id;
        document.getElementById('chat').innerHTML = "";
        if (allChats[id]) {
            allChats[id].data.forEach(m => add(m.content, m.type, false));
        }
        if(window.innerWidth < 900) document.getElementById('body').classList.remove('sidebar-open');
        updateSidebar();
    }

    function createNewChat() {
        currentChatId = Date.now().toString();
        document.getElementById('chat').innerHTML = "";
        add("Hola, soy LukaAI. ¿En qué puedo ayudarte hoy? 😄", "ai", false);
        updateSidebar();
    }

    function deleteChat(id) {
        delete allChats[id];
        localStorage.setItem('luka_storage', JSON.stringify(allChats));
        if (currentChatId === id) createNewChat();
        else updateSidebar();
    }

    function getHistoryForApi() {
        if(!allChats[currentChatId]) return [];
        return allChats[currentChatId].data.map(m => ({ 
            role: m.type === 'user' ? 'user' : 'assistant', 
            content: m.content 
        })).slice(-10);
    }

    document.getElementById('uIn').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
    window.onload = () => { 
        updateSidebar(); 
        if(allChats[currentChatId]) loadChat(currentChatId); 
        else createNewChat();
    };
</script>
</body>
</html>
