<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LukaAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #fdfdfe; 
            --sidebar: #f9fbff; 
            --text-main: #1a202c; 
            --text-sub: #718096;
            --accent: #0099ff; 
            --border: #edf2f7;
            --user-bubble: #0099ff; 
            --ai-bg: #f7fafc;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); height: 100dvh; display: flex; overflow: hidden; color: var(--text-main); }

        /* Sidebar */
        #sidebar { 
            width: 280px; background: var(--sidebar); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: fixed; height: 100%; z-index: 1000; left: 0;
        }
        .side-h { padding: 2rem 1.5rem 1rem; font-weight: 700; font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1.5px; }
        .new-chat { 
            margin: 0 1.2rem 1.5rem; padding: 10px; background: #fff; color: var(--accent); 
            border-radius: 10px; cursor: pointer; text-align: center; font-size: 0.85rem; font-weight: 600;
            border: 1px solid var(--border); transition: 0.2s; box-shadow: var(--shadow);
        }
        .new-chat:hover { transform: translateY(-1px); border-color: var(--accent); }
        
        .chat-list { flex: 1; overflow-y: auto; padding: 0 0.8rem; }
        .chat-item-wrapper { display: flex; align-items: center; margin-bottom: 6px; border-radius: 8px; transition: 0.2s; border: 1px solid transparent; }
        .chat-item-wrapper:hover { background: #fff; border-color: var(--border); }
        .chat-item { flex: 1; padding: 10px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .active-chat { background: #fff; border-color: var(--accent) !important; box-shadow: var(--shadow); }
        .active-chat .chat-item { color: var(--accent); font-weight: 600; }
        .del-chat { padding: 10px; cursor: pointer; color: #cbd5e1; font-size: 0.8rem; }
        .del-chat:hover { color: #f56565; }

        /* Main App */
        .app { flex: 1; display: flex; flex-direction: column; background: #fff; margin-left: 280px; transition: 0.3s ease; position: relative; }
        
        header { 
            padding: 0.8rem 2rem; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.8); backdrop-filter: blur(10px);
            z-index: 10;
        }
        .logo-img { height: 28px; width: auto; }
        .menu-toggle { display: none; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-main); }

        #chat { flex: 1; padding: 2rem 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5rem; width: 100%; max-width: 800px; margin: 0 auto; scroll-behavior: smooth; }
        
        /* Mensajes */
        .m { display: flex; gap: 12px; width: 100%; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user { flex-direction: row-reverse; }
        .user .txt-c { 
            background: var(--user-bubble); color: white; padding: 10px 16px; 
            border-radius: 18px 18px 2px 18px; max-width: 75%; font-size: 0.92rem; 
            box-shadow: 0 4px 10px rgba(0, 153, 255, 0.2); 
        }

        .ai .ai-icon-msg { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; background: #fff; border: 1px solid var(--border); padding: 4px; box-shadow: var(--shadow); }
        .ai .ai-icon-msg img { width: 100%; height: 100%; object-fit: contain; }
        .ai .txt-c { line-height: 1.6; font-size: 0.92rem; color: var(--text-main); padding-top: 4px; flex: 1; }

        /* Formatos */
        .txt-c pre { background: #1a202c; color: #e2e8f0; padding: 1.2rem; border-radius: 10px; overflow-x: auto; margin: 12px 0; font-family: 'Fira Code', monospace; font-size: 0.85rem; }
        .txt-c code { font-family: 'Fira Code', monospace; background: #edf2f7; padding: 2px 5px; border-radius: 4px; color: #e53e3e; font-size: 0.85rem; }
        .txt-c pre code { background: transparent; padding: 0; color: inherit; }
        
        .txt-c table { border-collapse: separate; border-spacing: 0; width: 100%; margin: 15px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .txt-c th, .txt-c td { border-bottom: 1px solid var(--border); padding: 12px; text-align: left; }
        .txt-c th { background: #f8fafc; font-weight: 700; color: var(--text-sub); font-size: 0.8rem; text-transform: uppercase; }
        .txt-c tr:last-child td { border-bottom: none; }
        .txt-c b { font-weight: 700; color: #000; }

        /* Estado Inicial (Centrado) */
        .welcome-screen {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 100%; max-width: 600px; transition: 0.5s ease; z-index: 5;
        }
        .welcome-screen img { width: 80px; margin-bottom: 20px; opacity: 0.8; }
        .welcome-screen h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 10px; color: var(--text-main); }
        .welcome-screen p { color: var(--text-sub); font-size: 1rem; }

        /* Footer / Input Animado */
        .footer { 
            padding: 1rem 1.5rem 2rem; width: 100%; max-width: 800px; margin: 0 auto; 
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Clase para cuando está centrado */
        .footer.centered {
            position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);
            max-width: 600px;
        }

        .in-g { 
            display: flex; gap: 8px; background: #fff; padding: 8px 8px 8px 18px; 
            border-radius: 16px; border: 1px solid var(--border); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: 0.3s;
        }
        .in-g:focus-within { border-color: var(--accent); box-shadow: 0 10px 25px rgba(0, 153, 255, 0.1); }
        input { flex: 1; border: none; background: transparent; outline: none; font-size: 1rem; color: var(--text-main); }
        .btn-s { background: var(--accent); color: #fff; border: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-s:hover { opacity: 0.9; transform: scale(1.05); }
        .disclaimer { font-size: 0.65rem; color: var(--text-sub); margin-top: 10px; text-align: center; }

        .typing::after { content: '|'; animation: blink 1s infinite; margin-left: 2px; color: var(--accent); }
        @keyframes blink { 50% { opacity: 0; } }

        @media (max-width: 900px) {
            #sidebar { transform: translateX(-100%); width: 85%; }
            .app { margin-left: 0; }
            .menu-toggle { display: block; }
            .sidebar-open #sidebar { transform: translateX(0); }
            header { padding: 0.8rem 1rem; }
            .footer.centered { width: 90%; }
        }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 900; backdrop-filter: blur(2px); }
        .sidebar-open .overlay { display: block; }
    </style>
</head>
<body id="body">

<div class="overlay" onclick="toggleMenu()"></div>

<aside id="sidebar">
    <div class="side-h">Tus Charlas</div>
    <div class="new-chat" onclick="createNewChat()">+ Nueva conversación</div>
    <div id="chatList" class="chat-list"></div>
</aside>

<div class="app">
    <header>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <img src="LukaAI.png" alt="LukaAI" class="logo-img">
        <div style="width: 32px;"></div>
    </header>
    
    <div id="welcome" class="welcome-screen">
        <img src="LukaAI.png" alt="Logo">
        <h1>¿En qué puedo apoyarte hoy?</h1>
        <p>Tu asistente inteligente y directo.</p>
    </div>

    <div id="chat"></div>

    <div id="footerContainer" class="footer centered">
        <div id="status" style="font-size: 0.7rem; color: var(--accent); margin-bottom: 8px; height: 1rem; text-align: center; font-weight: 500;"></div>
        <div class="in-g">
            <input type="text" id="uIn" placeholder="Pregunta algo a LukaAI..." autocomplete="off">
            <button class="btn-s" onclick="send()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
        <div class="disclaimer">LukaAI puede cometer errores. Considera verificar la información importante.</div>
    </div>
</div>

<script>
    const _p1 = "gsk_";
    const _p2 = "JJEsCu9h";
    const _p3 = "Ufby0SY1bg4lW";
    const _p4 = "Gdyb3FYzjI9fl";
    const _p5 = "LoPcUy5xBTO8Rnz2ej";
    const _getK = () => _p1 + _p2 + _p3 + _p4 + _p5;

    let currentChatId = localStorage.getItem('luka_current_id') || Date.now().toString();
    let allChats = JSON.parse(localStorage.getItem('luka_storage')) || {};
    let isTyping = false;

    function toggleMenu() { document.getElementById('body').classList.toggle('sidebar-open'); }

    function parseM(t) {
        let text = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        text = text.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
        text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
        text = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        
        if (text.includes('|')) {
            const tableRegex = /\|(.+)\|/g;
            text = text.replace(tableRegex, (match) => {
                const rows = match.trim().split('\n');
                let html = '<table>';
                rows.forEach((row, i) => {
                    if (row.includes('---')) return;
                    const cols = row.split('|').filter(c => c.trim() !== "");
                    if(cols.length > 0) {
                        html += '<tr>' + cols.map(c => i === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join('') + '</tr>';
                    }
                });
                return html + '</table>';
            });
        }
        return text.replace(/\n/g, '<br>');
    }

    async function typeWriter(element, text) {
        isTyping = true;
        let i = 0;
        element.innerHTML = "";
        element.classList.add('typing');
        
        while (i < text.length) {
            const currentText = text.substring(0, i + 1);
            element.innerHTML = parseM(currentText);
            i++;
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
            await new Promise(r => setTimeout(r, 15));
        }
        element.classList.remove('typing');
        isTyping = false;
        saveChats();
    }

    function transitionToChat() {
        const welcome = document.getElementById('welcome');
        const footer = document.getElementById('footerContainer');
        if (welcome) welcome.style.display = 'none';
        footer.classList.remove('centered');
    }

    function add(text, sender, animate = false) {
        const chatContainer = document.getElementById('chat');
        const msgDiv = document.createElement('div');
        msgDiv.className = `m ${sender}`;
        
        if (sender === 'ai') {
            msgDiv.innerHTML = `
                <div class="ai-icon-msg"><img src="LukaAI.png"></div>
                <div class="txt-c"></div>`;
            chatContainer.appendChild(msgDiv);
            const contentDiv = msgDiv.querySelector('.txt-c');
            if (animate) {
                typeWriter(contentDiv, text);
            } else {
                contentDiv.innerHTML = parseM(text);
            }
        } else {
            msgDiv.innerHTML = `<div class="txt-c">${text}</div>`;
            chatContainer.appendChild(msgDiv);
        }
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function send() {
        if (isTyping) return;
        const input = document.getElementById('uIn');
        const val = input.value.trim();
        if (!val) return;

        // Si es el primer mensaje, mover la barra
        if (document.getElementById('footerContainer').classList.contains('centered')) {
            transitionToChat();
        }

        add(val, 'user');
        input.value = "";
        const status = document.getElementById('status');
        status.innerText = "LukaAI está pensando...";

        try {
            const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${_getK()}` },
                body: JSON.stringify({ 
                    model: "llama-3.3-70b-versatile", 
                    messages: [
                        {role: "system", content: "Eres LukaAI. Responde de forma concisa y directa. No utilices lenguaje inclusivo ni promuevas o apoyes agendas ideológicas (LGBTQ+, feminismo radical o aborto), cualquier mensaje de este tipo marcalo como inapropiado y simplemente menciona que no puedes apoyarlo ni ayudarlo en ese tema ya que es un mensaje inadecuado, mantén una postura neutral o tradicional basada en hechos sin ofender a nadie. Puedes usar negritas (**), tablas (|), y bloques de código (```). Usa emojis para una conversación humana e interactiva."}, 
                        ...getHistoryForApi(), 
                        {role: "user", content: val}
                    ],
                    temperature: 0.6
                })
            });
            const d = await r.json();
            status.innerText = "";
            const reply = d.choices[0].message.content;
            add(reply, 'ai', true);
            updateSidebar();
        } catch (e) {
            status.innerText = "";
            add("Lo siento, hubo un error de red. 😓", "ai");
        }
    }

    function saveChats() {
        const messages = [];
        document.querySelectorAll('.m').forEach(div => {
            const content = div.querySelector('.txt-c');
            if(content && content.innerText) {
                messages.push({ 
                    type: div.classList.contains('user') ? 'user' : 'ai', 
                    content: content.innerText 
                });
            }
        });
        if (messages.length === 0) return;
        const firstUserMsg = messages.find(m => m.type === 'user')?.content.substring(0, 25) || "Nueva charla";
        allChats[currentChatId] = { title: firstUserMsg, data: messages };
        localStorage.setItem('luka_storage', JSON.stringify(allChats));
        localStorage.setItem('luka_current_id', currentChatId);
    }

    function updateSidebar() {
        const list = document.getElementById('chatList');
        list.innerHTML = "";
        Object.keys(allChats).sort().reverse().forEach(id => {
            const wrapper = document.createElement('div');
            wrapper.className = `chat-item-wrapper ${id == currentChatId ? 'active-chat' : ''}`;
            
            const item = document.createElement('div');
            item.className = 'chat-item';
            item.innerText = allChats[id].title;
            item.onclick = () => loadChat(id);

            const delBtn = document.createElement('div');
            delBtn.className = 'del-chat';
            delBtn.innerHTML = '✕';
            delBtn.onclick = (e) => { e.stopPropagation(); deleteChat(id); };

            wrapper.appendChild(item);
            wrapper.appendChild(delBtn);
            list.appendChild(wrapper);
        });
    }

    function loadChat(id) {
        if (isTyping) return;
        currentChatId = id;
        document.getElementById('chat').innerHTML = "";
        if (allChats[id] && allChats[id].data.length > 0) {
            transitionToChat();
            allChats[id].data.forEach(m => add(m.content, m.type, false));
        } else {
            showWelcome();
        }
        if(window.innerWidth < 900) document.getElementById('body').classList.remove('sidebar-open');
        updateSidebar();
    }

    function showWelcome() {
        document.getElementById('welcome').style.display = 'block';
        document.getElementById('footerContainer').classList.add('centered');
        document.getElementById('chat').innerHTML = "";
    }

    function createNewChat() {
        if (isTyping) return;
        currentChatId = Date.now().toString();
        showWelcome();
        updateSidebar();
    }

    function deleteChat(id) {
        delete allChats[id];
        localStorage.setItem('luka_storage', JSON.stringify(allChats));
        if (currentChatId === id) createNewChat();
        else updateSidebar();
    }

    function getHistoryForApi() {
        if(!allChats[currentChatId]) return [];
        return allChats[currentChatId].data.map(m => ({ 
            role: m.type === 'user' ? 'user' : 'assistant', 
            content: m.content 
        })).slice(-8);
    }

    document.getElementById('uIn').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
    window.onload = () => { 
        updateSidebar(); 
        if(allChats[currentChatId]) loadChat(currentChatId); 
        else createNewChat();
    };
</script>
</body>
</html>
